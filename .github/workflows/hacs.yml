name: Validate HACS

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: '0 0 * * *'

jobs:
  validate:
    # HACS validates the repository a pull request comes from, and forks have
    # no releases with the card's file, so their PRs would always fail
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: 'ubuntu-latest'
    steps:
      - name: HACS validation
        uses: 'hacs/action@main'
        with:
          category: 'plugin'
